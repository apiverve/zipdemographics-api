openapi: 3.0.4
info:
  title: ZIP Demographics
  description: >-
    ZIP Demographics is a demographic data API for any US ZIP code, built on the
    US Census American Community Survey. Every plan gets total population and
    median household income, while paid plans add age, per-capita income,
    education, housing, employment, and racial composition.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/zipdemographics:
    get:
      summary: ZIP Demographics
      description: Get demographic data for a ZIP code
      operationId: zipdemographics
      parameters:
        - name: zip
          in: query
          schema:
            type: string
          required: true
          description: 5-digit US ZIP code
          example: '90210'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  zip: '90210'
                  name: ZCTA5 90210
                  acsYear: 2024
                  population:
                    total: 19004
                    male: 9417
                    female: 9587
                    medianAge: 51
                  income:
                    medianHousehold: 187801
                    perCapita: 147098
                  housing:
                    medianHomeValue: 2000001
                    medianRent: 3251
                    totalUnits: 9531
                    occupiedUnits: 8029
                    vacantUnits: 1502
                    ownerOccupied: 5679
                    renterOccupied: 2350
                    homeOwnershipRate: 70.7
                  education:
                    collegeEducatedPct: 68.1
                    bachelors: 4837
                    masters: 2389
                    professional: 1962
                    doctorate: 929
                  employment:
                    laborForce: 9017
                    unemployed: 468
                    unemploymentRate: 5.2
                  race:
                    white:
                      count: 15147
                      percent: 79.7
                    black:
                      count: 403
                      percent: 2.1
                    asian:
                      count: 1628
                      percent: 8.6
                    hispanic:
                      count: 1138
                      percent: 6
                  formatted:
                    medianHouseholdIncome: $187,801
                    perCapitaIncome: $147,098
                    medianHomeValue: $2,000,001
                    medianRent: $3,251
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
